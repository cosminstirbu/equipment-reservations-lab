worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 64; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_body_timeout 5s;
  client_header_timeout 5s;
  keepalive_timeout 5s;
  server {
    listen 8080;
    server_name _;
    client_max_body_size 1k;
    location = /api/queues/equipment/reservation-notifications {
      if ($request_uri != "/api/queues/equipment/reservation-notifications") { return 404 "not found"; }
      if ($request_method != GET) { return 405 "method denied"; }
      if ($http_transfer_encoding != "") { return 400 "body denied"; }
      if ($content_length !~ "^(|0)$") { return 400 "body denied"; }
      proxy_pass https://rabbitmq.equipment.svc.cluster.local:15671/api/queues/equipment/reservation-notifications?disable_stats=true&enable_queue_totals=true;
      proxy_ssl_server_name on;
      proxy_ssl_name rabbitmq.equipment.svc.cluster.local;
      proxy_ssl_trusted_certificate /trust/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_connect_timeout 5s;
      proxy_send_timeout 5s;
      proxy_read_timeout 10s;
      proxy_next_upstream off;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_pass_request_headers off;
      proxy_set_header Host rabbitmq.equipment.svc.cluster.local;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_hide_header Set-Cookie;
      proxy_hide_header Server;
      proxy_max_temp_file_size 0;
      proxy_intercept_errors on;
      error_page 401 403 = @unauthorized;
      error_page 400 404 405 500 502 503 504 = @unavailable;
    }
    location @unauthorized { return 401 '{"error":"broker monitoring unauthorized"}'; }
    location @unavailable { return 502 '{"error":"broker monitoring unavailable"}'; }
    location / { return 404 "not found"; }
  }
}
