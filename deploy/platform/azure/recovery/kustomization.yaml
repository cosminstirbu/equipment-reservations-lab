{
  'apiVersion': 'kustomize.config.k8s.io/v1beta1',
  'kind': 'Kustomization',
  'resources':
    ['clients.json', 'database-bootstrap.json', 'network.json', 'monitor'],
  'components': ['runtime'],
  'configMapGenerator':
    [
      {
        'name': 'equipment-recovery-sql',
        'namespace': 'equipment',
        'files': ['database-bootstrap.sql'],
      },
    ],
  'generatorOptions':
    {
      'disableNameSuffixHash': true,
      'annotations': { 'argocd.argoproj.io/sync-wave': '-30' },
    },
}
