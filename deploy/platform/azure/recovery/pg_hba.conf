# Azure-only recovery boundary: PUBLIC CONNECT on any future database must not
# admit a recovery role. These rules precede the ordinary application policy.
host inventory,reservations,notifications,keycloak equipment_backup,equipment_restore 0.0.0.0/0 scram-sha-256
host inventory,reservations,notifications,keycloak equipment_backup,equipment_restore ::/0 scram-sha-256
host all equipment_backup,equipment_restore 0.0.0.0/0 reject
host all equipment_backup,equipment_restore ::/0 reject
local all equipment_backup,equipment_restore reject
local all all peer
host all all 0.0.0.0/0 scram-sha-256
host all all ::/0 scram-sha-256
