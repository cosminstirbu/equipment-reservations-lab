apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - storage
  - network
  - ingress
  - certificates
  - telemetry
  - recovery-controls
configMapGenerator:
  - name: equipment-postgres-access
    namespace: equipment
    files:
      - pg_hba.conf=recovery/pg_hba.conf
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: '-65'
components:
  - runtime
