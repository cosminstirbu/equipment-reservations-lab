extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/clients:
    tokens:
      - ${env:INVENTORY_TOKEN}
      - ${env:RESERVATIONS_TOKEN}
      - ${env:NOTIFICATIONS_TOKEN}
      - ${env:DATABASE_BOOTSTRAP_TOKEN}
      - ${env:IDENTITY_BOOTSTRAP_TOKEN}
      - ${env:BROKER_BOOTSTRAP_TOKEN}
  bearertokenauth/prometheus:
    token: ${env:PROMETHEUS_TOKEN}
  bearertokenauth/loki:
    token: ${env:LOKI_TOKEN}
  bearertokenauth/tempo:
    token: ${env:TEMPO_TOKEN}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
        auth:
          authenticator: bearertokenauth/clients
        tls:
          cert_file: /tls/tls.crt
          key_file: /tls/tls.key
          min_version: '1.2'
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/privacy:
    actions:
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: http.url
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  otlp_grpc/dashboard:
    endpoint: dashboard.equipment.svc:18889
    tls:
      ca_file: /tls/ca.crt
    headers:
      x-otlp-api-key: ${env:DASHBOARD_OTLP}
    timeout: 5s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlp_http/prometheus:
    endpoint: https://prometheus.equipment-platform.svc:8443/api/v1/otlp
    tls:
      ca_file: /tls/ca.crt
    auth:
      authenticator: bearertokenauth/prometheus
    timeout: 5s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlp_http/loki:
    endpoint: https://loki.equipment-platform.svc:8443/otlp
    tls:
      ca_file: /tls/ca.crt
    auth:
      authenticator: bearertokenauth/loki
    timeout: 5s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlp_http/tempo:
    endpoint: https://tempo.equipment-platform.svc:8443
    tls:
      ca_file: /tls/ca.crt
    auth:
      authenticator: bearertokenauth/tempo
    timeout: 5s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
service:
  extensions:
    - health_check
    - bearertokenauth/clients
    - bearertokenauth/prometheus
    - bearertokenauth/loki
    - bearertokenauth/tempo
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlp_grpc/dashboard, otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlp_grpc/dashboard, otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/dashboard, otlp_http/prometheus]
