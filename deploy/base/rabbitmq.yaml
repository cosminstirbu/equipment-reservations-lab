---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/part-of: equipment
    app.kubernetes.io/name: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: equipment
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          volumeMounts:
            - name: data
              mountPath: '/var/lib/rabbitmq'
              readOnly: false
            - name: definitions
              mountPath: '/etc/rabbitmq/equipment-definitions.json'
              readOnly: true
              subPath: definitions.json
            - name: configuration
              mountPath: '/etc/rabbitmq/conf.d/20-equipment.conf'
              readOnly: true
              subPath: rabbitmq.conf
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - '-q'
                - ping
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - '-q'
                - ping
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - '-q'
                - ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: definitions
          emptyDir:
            sizeLimit: 1Mi
        - name: configuration
          configMap:
            name: equipment-broker
        - name: trust
          configMap:
            name: equipment-ca
      initContainers:
        - name: definitions
          image: broker-bootstrap
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: BrokerAdministrator
              value: equipment-admin
            - name: BrokerPassword
              valueFrom:
                secretKeyRef:
                  name: equipment-credentials
                  key: rabbitAdmin
            - name: BrokerAdministratorSalt
              valueFrom:
                secretKeyRef:
                  name: equipment-credentials
                  key: brokerAdminSalt
            - name: PublisherPassword
              valueFrom:
                secretKeyRef:
                  name: equipment-credentials
                  key: rabbitPublisher
            - name: PublisherSalt
              valueFrom:
                secretKeyRef:
                  name: equipment-credentials
                  key: brokerPublisherSalt
            - name: ConsumerPassword
              valueFrom:
                secretKeyRef:
                  name: equipment-credentials
                  key: rabbitConsumer
            - name: ConsumerSalt
              valueFrom:
                secretKeyRef:
                  name: equipment-credentials
                  key: brokerConsumerSalt
            - name: OTLP_KEY
              valueFrom:
                secretKeyRef:
                  name: equipment-credentials
                  key: dashboardOtlp
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: x-otlp-api-key=$(OTLP_KEY)
            - name: OTEL_SERVICE_NAME
              value: broker-bootstrap
          command:
            - '/usr/bin/timeout'
            - '--signal=TERM'
            - 30s
            - '/app/run'
          args:
            - '--output'
            - '/definitions/definitions.json'
          volumeMounts:
            - name: definitions
              mountPath: '/definitions'
              readOnly: false
            - name: trust
              mountPath: '/trust'
              readOnly: true
          envFrom:
            - configMapRef:
                name: equipment-runtime
