---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/part-of: equipment
    app.kubernetes.io/name: web
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: equipment
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: web
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: configuration
              mountPath: '/usr/share/nginx/html/auth-config.json'
              readOnly: true
              subPath: auth-config.json
            - name: proxy
              mountPath: '/etc/nginx/nginx.conf'
              readOnly: true
              subPath: nginx.conf
            - name: tmp
              mountPath: '/tmp'
              readOnly: false
          startupProbe:
            httpGet:
              path: '/'
              port: 8080
              httpHeaders:
                - name: Host
                  value: app.equipment.test
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: '/'
              port: 8080
              httpHeaders:
                - name: Host
                  value: app.equipment.test
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: '/'
              port: 8080
              httpHeaders:
                - name: Host
                  value: app.equipment.test
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: configuration
          configMap:
            name: equipment-web
        - name: proxy
          configMap:
            name: equipment-proxy
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
