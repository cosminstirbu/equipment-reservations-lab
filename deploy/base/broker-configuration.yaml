---
apiVersion: v1
kind: ConfigMap
metadata:
  name: equipment-broker
  labels:
    app.kubernetes.io/part-of: equipment
    app.kubernetes.io/name: equipment-broker
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
data:
  rabbitmq.conf: |
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/equipment-definitions.json
    definitions.skip_if_unchanged = true
