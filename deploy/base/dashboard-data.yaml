apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashboard-data
  labels:
    app.kubernetes.io/part-of: equipment
    app.kubernetes.io/name: dashboard-data
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ''
  resources:
    requests:
      storage: 1Gi
