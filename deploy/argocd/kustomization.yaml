apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/a5038b0e2bbac1715754380ae0084df8e3d5b48c/manifests/install.yaml
images:
  - name: quay.io/argoproj/argocd
    digest: sha256:13db7b10db23283b1b36f855046602e18539a8a8204c9f6f039e8896c8897518
  - name: ghcr.io/dexidp/dex
    digest: sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
  - name: public.ecr.aws/docker/library/redis
    digest: sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
patches:
  - path: resources.yaml
  - target:
      kind: Deployment
      name: argocd-applicationset-controller|argocd-dex-server|argocd-notifications-controller
    patch: |-
      - op: add
        path: /spec/replicas
        value: 0
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      - op: remove
        path: /spec/replicas
