---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: equipment
resources:
  - '../../base'
  - jobs/database
  - jobs/identity
  - ingress.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-postgres"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
  - target:
      kind: PersistentVolumeClaim
      name: rabbitmq-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-rabbitmq"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
images: [
  {
    "name": "broker-bootstrap",
    "newName": "ghcr.io/cosminstirbu/equipment-reservations-lab-broker-bootstrap",
    "digest": "sha256:61e2694442a3a36061a37985073aefdf224d51c049f6e9366c4e635cd6ba1e33"
  }
]

generators:
  - configuration.yaml
  - web-configuration.yaml
  - proxy-configuration.yaml
