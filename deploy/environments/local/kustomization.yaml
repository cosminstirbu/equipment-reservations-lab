---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: equipment
resources:
  - '../../base'
  - jobs/database
  - jobs/identity
  - ingress.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-postgres"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
  - target:
      kind: PersistentVolumeClaim
      name: rabbitmq-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-rabbitmq"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
images: [
  {
    "name": "web",
    "newName": "ghcr.io/cosminstirbu/equipment-reservations-lab-web",
    "digest": "sha256:59fcd3868c0cbe67dc400cc742bee119dc6ed943ac982080af04a38f232310ba"
  }
]

generators:
  - configuration.yaml
  - web-configuration.yaml
  - proxy-configuration.yaml
