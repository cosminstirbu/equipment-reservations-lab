---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: equipment
resources:
  - '../../base'
  - jobs/database
  - jobs/identity
  - ingress.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-postgres"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
  - target:
      kind: PersistentVolumeClaim
      name: rabbitmq-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-rabbitmq"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
images: [
  {
    "name": "inventory",
    "newName": "ghcr.io/cosminstirbu/equipment-reservations-lab-inventory",
    "digest": "sha256:695bf2955edce0e17294d05948472064bb99728321d68cadd737a33febf0482f"
  }
]

generators:
  - configuration.yaml
  - web-configuration.yaml
  - proxy-configuration.yaml
