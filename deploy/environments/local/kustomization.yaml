---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: equipment
resources:
  - '../../base'
  - jobs/database
  - jobs/identity
  - ingress.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: dashboard-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-dashboard"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
  - path: images/inventory.yaml
  - path: images/reservations.yaml
  - path: images/notifications.yaml
  - path: images/web.yaml
  - path: images/database-bootstrap.yaml
  - path: images/identity-bootstrap.yaml
  - path: images/broker-bootstrap.yaml
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-postgres"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
  - target:
      kind: PersistentVolumeClaim
      name: rabbitmq-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-rabbitmq"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
images: []
generators:
  - configuration.yaml
  - web-configuration.yaml
  - proxy-configuration.yaml
