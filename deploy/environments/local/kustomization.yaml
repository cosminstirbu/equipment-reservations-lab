---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: equipment
resources:
  - '../../base'
  - jobs/database
  - jobs/identity
  - ingress.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-postgres"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
  - target:
      kind: PersistentVolumeClaim
      name: rabbitmq-data
    patch:
      '[{"op": "add", "path": "/spec/volumeName", "value": "equipment-rabbitmq"},
      {"op": "replace", "path": "/spec/storageClassName", "value": "equipment-retain"}]'
images:
  - name: notifications
    newName: ghcr.io/cosminstirbu/equipment-reservations-lab-notifications
    digest: sha256:417037ac87ed80f9470c10af74e9e7ddf9ab5bd4a6977b9ced44b6ba61b835c5
generators:
  - configuration.yaml
  - web-configuration.yaml
  - proxy-configuration.yaml
