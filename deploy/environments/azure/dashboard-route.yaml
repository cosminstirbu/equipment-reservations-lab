apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`dashboard.codingfunlab.com`) && !PathPrefix(`/api`) && !PathPrefix(`/v1`)
      kind: Rule
      middlewares:
        - name: operator-source
      services:
        - name: dashboard
          port: 18888
  tls:
    secretName: dashboard-public-tls
