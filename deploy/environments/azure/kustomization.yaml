apiVersion: 'kustomize.config.k8s.io/v1beta1'
kind: 'Kustomization'
namespace: 'equipment'
resources:
  - '../../base'
  - 'jobs/database'
  - 'jobs/identity'
  - 'ingress.yaml'
  - 'dashboard-route.yaml'
components:
  - 'runtime'
generators:
  - 'broker-configuration.yaml'
  - 'configuration.yaml'
  - 'web-configuration.yaml'
  - 'proxy-configuration.yaml'
patches:
  - path: broker-tls.yaml
  - path: postgres-access.yaml
  - target:
      kind: 'PersistentVolumeClaim'
      name: 'postgres-data'
    patch: |-
      [
        {
          "op": "replace",
          "path": "/spec/storageClassName",
          "value": "equipment-azure-retain"
        }
      ]
  - target:
      kind: 'PersistentVolumeClaim'
      name: 'rabbitmq-data'
    patch: |-
      [
        {
          "op": "replace",
          "path": "/spec/storageClassName",
          "value": "equipment-azure-retain"
        }
      ]
  - target:
      kind: 'PersistentVolumeClaim'
      name: 'dashboard-data'
    patch: |-
      [
        {
          "op": "replace",
          "path": "/spec/storageClassName",
          "value": "equipment-azure-retain"
        }
      ]
  - patch: |-
      {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "name": "inventory"
        },
        "spec": {
          "template": {
            "metadata": {
              "labels": {
                "azure.workload.identity/use": "true"
              }
            },
            "spec": {
              "serviceAccountName": "inventory",
              "volumes": [
                {
                  "name": "secrets-store",
                  "csi": {
                    "driver": "secrets-store.csi.k8s.io",
                    "readOnly": true,
                    "volumeAttributes": {
                      "secretProviderClass": "inventory"
                    }
                  }
                },
                {
                  "name": "trust",
                  "$patch": "delete"
                },
                {
                  "name": "otlp-trust",
                  "secret": {
                    "secretName": "collector-trust"
                  }
                }
              ],
              "containers": [
                {
                  "name": "inventory",
                  "volumeMounts": [
                    {
                      "name": "trust",
                      "$patch": "delete"
                    },
                    {
                      "name": "secrets-store",
                      "mountPath": "/mnt/secrets-store",
                      "readOnly": true
                    },
                    {
                      "name": "otlp-trust",
                      "mountPath": "/otlp-trust",
                      "readOnly": true
                    }
                  ],
                  "env": [
                    {
                      "name": "OTLP_KEY",
                      "$patch": "delete"
                    },
                    {
                      "name": "OTLP_TOKEN",
                      "valueFrom": {
                        "secretKeyRef": {
                          "name": "inventory-credentials",
                          "key": "otlpToken"
                        }
                      }
                    },
                    {
                      "name": "OTEL_EXPORTER_OTLP_HEADERS",
                      "value": "authorization=Bearer%20$(OTLP_TOKEN)"
                    }
                  ]
                }
              ]
            }
          }
        }
      }
