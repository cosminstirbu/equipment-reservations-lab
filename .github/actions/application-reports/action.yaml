name: Application test and coverage reports
description: Publish assessed application test results and separate coverage reports
runs:
  using: composite
  steps:
    - name: Backend test results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
      if: ${{ !cancelled() }}
      with:
        name: Backend application tests
        report-title: Backend application tests
        path: test-results/application/backend.xml
        reporter: jest-junit
        use-actions-summary: 'true'
        fail-on-empty: 'true'
        fail-on-error: 'true'
        list-tests: failed
        max-annotations: '0'
    - name: Frontend test results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
      if: ${{ !cancelled() }}
      with:
        name: Frontend application tests
        report-title: Frontend application tests
        path: test-results/application/frontend.xml
        reporter: jest-junit
        use-actions-summary: 'true'
        fail-on-empty: 'true'
        fail-on-error: 'true'
        list-tests: failed
        max-annotations: '0'
    - name: Backend coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31
      if: ${{ !cancelled() && hashFiles('test-results/application/coverage/backend/*.xml') != '' }}
      with:
        reports: test-results/application/coverage/backend/*.xml
        targetdir: test-results/application/coverage/backend/report
        reporttypes: Html;MarkdownSummaryGithub;Cobertura
        sourcedirs: ${{ github.workspace }}
        toolpath: ${{ runner.temp }}/reportgenerator
        title: Backend coverage
    - name: Frontend coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31
      if: ${{ !cancelled() && hashFiles('test-results/application/coverage/frontend/*.xml') != '' }}
      with:
        reports: test-results/application/coverage/frontend/*.xml
        targetdir: test-results/application/coverage/frontend/report
        reporttypes: Html;MarkdownSummaryGithub;Cobertura
        sourcedirs: ${{ github.workspace }}
        toolpath: ${{ runner.temp }}/reportgenerator
        title: Frontend coverage
    - name: Coverage summaries and completeness
      if: ${{ !cancelled() }}
      shell: bash
      run: node scripts/application-reporting.mjs summary
    - name: Downloadable assessed reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ !cancelled() && hashFiles('test-results/application/**') != '' }}
      with:
        name: application-test-and-coverage-reports
        path: test-results/application/
        if-no-files-found: error
        retention-days: 14
