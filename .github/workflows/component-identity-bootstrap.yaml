name: Component identity-bootstrap
on:
  workflow_call:
jobs:
  build:
    name: Build identity-bootstrap
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/component-build.yaml
    with:
      component: identity-bootstrap
      publish: true
  promote:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: local-component-promotion
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: npm ci
      - name: Load original intent and verified component evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/component-pipelines.mjs load-intent --output "$RUNNER_TEMP/run-intent.json"
          node scripts/component-pipelines.mjs load-result --component identity-bootstrap --output "$RUNNER_TEMP/component-result.json"
      - name: Install pinned static manifest tool
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/manifest-tools"
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/manifest-tools/kubectl"
          echo "874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf  $RUNNER_TEMP/manifest-tools/kubectl" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/manifest-tools/kubectl"
      - name: Validate and commit component update directly to main
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_KUBECTL: ${{ runner.temp }}/manifest-tools/kubectl
        run: node scripts/promote-images.mjs "$RUNNER_TEMP/component-result.json" "$RUNNER_TEMP/run-intent.json"
