name: Main release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Classify validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.quality_scope.outputs.mode }}
      reason: ${{ steps.quality_scope.outputs.reason }}
      paths: ${{ steps.quality_scope.outputs.paths }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
      - id: quality_scope
        name: Classify required quality
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.token || '' }}
        run: node scripts/manifest-quality.mjs select --output "$RUNNER_TEMP/quality-scope.json"
  quality:
    name: quality
    needs: [scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ needs.scope.outputs.mode }}
      reason: ${{ needs.scope.outputs.reason }}
      infrastructure_validated: ${{ steps.azure_infrastructure_done.outputs.validated }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Install checksum-pinned Azure tools and policies
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        run: npm run infra:tools
      - name: Deterministic Terraform source gates
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        run: npm run infra:check
      - name: Native Terraform contracts
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        run: npm run infra:test
      - name: Check Azure tooling and workflow formatting
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        run: npm run format-check -- scripts/azure-*.mjs .github/workflows/azure-*.yaml .github/workflows/pull-request.yaml
      - name: Lint Azure tooling
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        run: node node_modules/eslint/bin/eslint.js scripts/azure-*.mjs --max-warnings 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        with:
          global-json-file: global.json
      - name: Prepare native Azure provider runtime
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update --quiet
          sudo apt-get install --yes podman
          mkdir -p "$RUNNER_TEMP/azure-provider-bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec sudo --non-interactive /usr/bin/podman "$@"' > "$RUNNER_TEMP/azure-provider-bin/podman"
          chmod 0755 "$RUNNER_TEMP/azure-provider-bin/podman"
          "$RUNNER_TEMP/azure-provider-bin/podman" info >/dev/null
          echo "$RUNNER_TEMP/azure-provider-bin" >> "$GITHUB_PATH"
      - name: Azure tooling and provider contracts
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        run: node --test scripts/azure-*.test.mjs scripts/manifest-quality.test.mjs
        env:
          KUBECTL: ${{ github.workspace }}/.cache/azure-toolchain/kubectl/kubectl
          KIND: ${{ github.workspace }}/.cache/azure-toolchain/kind/kind
          CONTAINER_RUNTIME: podman
          AZURE_PROVIDER_CONTRACTS: '1'
      - name: Validate authored and synthetic Azure manifests
        if: needs.scope.outputs.mode == 'infrastructure' || needs.scope.outputs.mode == 'full'
        run: node scripts/manifest-quality.mjs azure
      - id: azure_infrastructure_done
        name: Record completed infrastructure gates
        if: needs.scope.outputs.mode == 'infrastructure'
        run: echo "validated=true" >> "$GITHUB_OUTPUT"
      - run: npm --prefix src/Web ci
        if: needs.scope.outputs.mode == 'full'
      - name: Validate committed release and bootstrap identities
        if: needs.scope.outputs.mode == 'full'
        run: node scripts/deployment-validation.mjs committed
      - name: Install pinned promotion validation tool
        if: needs.scope.outputs.mode == 'full'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/manifest-tools"
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/manifest-tools/kubectl"
          echo "874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf  $RUNNER_TEMP/manifest-tools/kubectl" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/manifest-tools/kubectl"
      - id: application_quality
        run: npm run check -- --reports
        if: needs.scope.outputs.mode == 'full'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: 'false'
          MANIFEST_KUBECTL: ${{ runner.temp }}/manifest-tools/kubectl
      - run: node --test scripts/direct-promotion.test.mjs scripts/deployment-validation.test.mjs scripts/promote-images.test.mjs scripts/deployment-ci.test.mjs scripts/local-platform.test.mjs scripts/local-kubernetes.test.mjs scripts/deployment-smoke.test.mjs scripts/argo-ordering.test.mjs
        if: needs.scope.outputs.mode == 'full'
        env:
          MANIFEST_KUBECTL: ${{ runner.temp }}/manifest-tools/kubectl
      - name: Application test and coverage reports
        if: ${{ !cancelled() && needs.scope.outputs.mode == 'full' && steps.application_quality.outcome != 'skipped' }}
        uses: ./.github/actions/application-reports
      - name: Full application quality completed
        if: needs.scope.outputs.mode == 'full'
        run: echo 'Full application quality completed'
      - name: Install pinned static manifest tool
        if: needs.scope.outputs.mode == 'manifest'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/manifest-tools"
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/manifest-tools/kubectl"
          echo "874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf  $RUNNER_TEMP/manifest-tools/kubectl" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/manifest-tools/kubectl"
      - name: Validate scoped static manifests
        if: needs.scope.outputs.mode == 'manifest'
        shell: bash
        env:
          QUALITY_MODE: ${{ needs.scope.outputs.mode }}
          QUALITY_REASON: ${{ needs.scope.outputs.reason }}
          QUALITY_PATHS: ${{ needs.scope.outputs.paths }}
        run: |
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.env.RUNNER_TEMP + "/quality-scope.json", JSON.stringify({mode: process.env.QUALITY_MODE, reason: process.env.QUALITY_REASON, paths: JSON.parse(process.env.QUALITY_PATHS)}));'
          node scripts/manifest-quality.mjs validate --selection "$RUNNER_TEMP/quality-scope.json" --kubectl "$RUNNER_TEMP/manifest-tools/kubectl"
  deployment:
    name: Kubernetes verification
    needs: [scope]
    if: needs.scope.outputs.mode == 'full'
    permissions:
      contents: read
    uses: ./.github/workflows/kubernetes-verification.yaml
  select:
    name: Select components
    needs: [quality, deployment]
    if: ${{ !cancelled() && needs.quality.result == 'success' && ((needs.quality.outputs.mode == 'full' && needs.deployment.result == 'success') || (needs.quality.outputs.mode == 'manifest' && needs.deployment.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      inventory: ${{ steps.select.outputs.inventory }}
      reservations: ${{ steps.select.outputs.reservations }}
      notifications: ${{ steps.select.outputs.notifications }}
      web: ${{ steps.select.outputs.web }}
      database_bootstrap: ${{ steps.select.outputs.database_bootstrap }}
      identity_bootstrap: ${{ steps.select.outputs.identity_bootstrap }}
      broker_bootstrap: ${{ steps.select.outputs.broker_bootstrap }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: npm ci
      - id: select
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
        run: node scripts/component-pipelines.mjs select --output "$RUNNER_TEMP/component-selection.json"
      - id: intent
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/component-pipelines.mjs intent --selection "$RUNNER_TEMP/component-selection.json" --output "$RUNNER_TEMP/run-intent.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request' && steps.intent.outputs.created == 'true'
        with:
          name: run-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/run-intent.json
          if-no-files-found: error
          retention-days: 30
  component_inventory:
    name: Component inventory
    needs: [quality, select]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.select.result == 'success' && needs.select.outputs.inventory == 'true' }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/component-inventory.yaml
  component_reservations:
    name: Component reservations
    needs: [quality, select]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.select.result == 'success' && needs.select.outputs.reservations == 'true' }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/component-reservations.yaml
  component_notifications:
    name: Component notifications
    needs: [quality, select]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.select.result == 'success' && needs.select.outputs.notifications == 'true' }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/component-notifications.yaml
  component_web:
    name: Component web
    needs: [quality, select]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.select.result == 'success' && needs.select.outputs.web == 'true' }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/component-web.yaml
  component_database_bootstrap:
    name: Component database-bootstrap
    needs: [quality, select]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.select.result == 'success' && needs.select.outputs.database_bootstrap == 'true' }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/component-database-bootstrap.yaml
  component_identity_bootstrap:
    name: Component identity-bootstrap
    needs: [quality, select]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.select.result == 'success' && needs.select.outputs.identity_bootstrap == 'true' }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/component-identity-bootstrap.yaml
  component_broker_bootstrap:
    name: Component broker-bootstrap
    needs: [quality, select]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.select.result == 'success' && needs.select.outputs.broker_bootstrap == 'true' }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/component-broker-bootstrap.yaml
  summary:
    if: always()
    needs:
      [
        quality,
        deployment,
        select,
        component_inventory,
        component_reservations,
        component_notifications,
        component_web,
        component_database_bootstrap,
        component_identity_bootstrap,
        component_broker_bootstrap,
      ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: npm ci
      - name: Required independent component outcomes
        env:
          SELECTED_COMPONENTS: ${{ needs.select.outputs.selected || '[]' }}
          PIPELINE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/deployment-ci.mjs summary
      - name: Required quality mode
        if: always()
        env:
          QUALITY_MODE: ${{ needs.quality.outputs.mode }}
          QUALITY_REASON: ${{ needs.quality.outputs.reason }}
        shell: bash
        run: |
          printf 'Required quality mode: %s (%s)\n' "${QUALITY_MODE:-unavailable}" "${QUALITY_REASON:-unavailable}" | tee -a "$GITHUB_STEP_SUMMARY"
