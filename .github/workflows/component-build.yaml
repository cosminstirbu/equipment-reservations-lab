name: Component build core
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      publish:
        required: true
        type: boolean
jobs:
  build:
    name: ${{ inputs.publish && 'Publish' || 'Build' }} ${{ inputs.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: npm ci
      - id: retained
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: node scripts/component-pipelines.mjs load-result --component "$COMPONENT" --output "$RUNNER_TEMP/component-result.json"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: steps.retained.outputs.available != 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.retained.outputs.available != 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: inputs.publish && steps.retained.outputs.available != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build one immutable component
        if: steps.retained.outputs.available != 'true'
        env:
          COMPONENT: ${{ inputs.component }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == 'true' ]]; then
            node scripts/deployment-ci.mjs component "$COMPONENT" --publish --output "$RUNNER_TEMP/component-result.json"
          else
            node scripts/deployment-ci.mjs component "$COMPONENT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.publish && steps.retained.outputs.available != 'true'
        with:
          name: component-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/component-result.json
          if-no-files-found: error
          retention-days: 30
